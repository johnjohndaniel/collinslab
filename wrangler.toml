# Cloudflare Pages config (classic Pages project "collinslab").
# Secrets (SESSION_SECRET, ALLOWED_EMAIL) are set with `wrangler pages secret put`, never here.
name = "collinslab"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

[vars]
GOOGLE_CLIENT_ID = "772715870369-biis7tljej1qnk2mi7teltg756m6oo2a.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "collinslab"
database_id = "5b4c1ec3-8488-497c-b2d3-f0b1e8715131"
migrations_dir = "migrations"

# Brain feed (read-only by convention: the site only calls get()). Contract: ~/brain/docs/FEED.md
[[r2_buckets]]
binding = "BRAIN_FEED"
bucket_name = "brain-feed"
